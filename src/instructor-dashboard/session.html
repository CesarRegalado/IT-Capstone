<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-In | Attendance Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f5f5f5;
            color: #333;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .qr-code-container {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: white;
            border: 4px dashed #ddd;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            z-index: 1;
        }

        .qr-icon {
            font-size: 10rem;
            color: #666;
            margin-bottom: 30px;
        }

        .qr-image {
            width: 320px;
            height: 320px;
            display: grid;
            place-items: center;
            background: white;
            border-radius: 12px;
            margin-bottom: 24px;
        }

        .qr-image img,
        .qr-image canvas {
            max-width: 100%;
            max-height: 100%;
        }

        .qr-text {
            font-size: 2rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            font-family: monospace;
        }

        .qr-instruction {
            color: #666;
            font-size: 1.1rem;
            text-align: center;
            line-height: 1.5;
        }

        .info-panel {
            position: absolute;
            left: calc(50% + 350px); /* Position to the right of QR code */
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 40px;
            min-width: 300px;
        }

        .course-info {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        .course-name {
            font-size: 1.4rem;
            color: #333;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .class-code-label {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .class-code {
            font-size: 2rem;
            font-weight: bold;
            color: #333;
            letter-spacing: 8px;
            font-family: 'Courier New', monospace;
            background: #f0f0f0;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #ddd;
        }

        .qr-link {
            margin-top: 12px;
            font-size: 0.85rem;
            color: #666;
            word-break: break-all;
        }

        .button-container {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .end-session-btn {
            background: #d32f2f;
            color: white;
            padding: 12px 15px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.2s;
            min-width: 160px;
        }

        .end-session-btn:hover {
            background: #c62828;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(211, 47, 47, 0.3);
        }
    </style>
</head>
<body>
    <!-- QR Code (Absolutely Centered) -->
    <div class="qr-code-container" id="qrCodeContainer">
        <div class="qr-image" id="qrImage">
            <div class="qr-icon">
                <i class="fas fa-qrcode"></i>
            </div>
        </div>
        <div class="qr-text" id="qrClassCode">----</div>
        <div class="qr-instruction">
            Scan QR code to open the check-in form
        </div>
        <div class="qr-link" id="checkinUrlText"></div>
    </div>
    
    <!-- Info Panel Positioned to the Right -->
    <div class="info-panel">
        <div class="course-info">
            <div class="course-name" id="courseTitle">Loading...</div>
            <div class="class-code-label">Check-in Code:</div>
            <div class="class-code" id="classCode">----</div>
        </div>

        <div class="button-container">
            <button class="end-session-btn" onclick="endSession()">
                <i class="fas fa-stop"></i>
                End Session
            </button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="../js/config.js"></script>
    <script>
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const classCode = urlParams.get('code');
        const course = urlParams.get('course');
        const configuredBase = (window.APP_BASE_URL || '').trim();
        const checkinUrl = configuredBase
            ? new URL('checkin.html', configuredBase.endsWith('/') ? configuredBase : `${configuredBase}/`)
            : new URL('../checkin.html', window.location.href);
        if (classCode) {
            checkinUrl.searchParams.set('code', classCode);
        }

        // Update display with course information
        document.getElementById('classCode').textContent = classCode || '----';
        document.getElementById('qrClassCode').textContent = classCode || '----';
        document.getElementById('courseTitle').textContent = course ? 
            `${decodeURIComponent(course)}` : 'Course Not Specified';
        document.getElementById('checkinUrlText').textContent = classCode ? checkinUrl.toString() : '';

        // Render QR code that opens the public check-in page
        if (classCode && window.QRCode) {
            const qrHost = document.getElementById('qrImage');
            qrHost.innerHTML = '';
            new QRCode(qrHost, {
                text: checkinUrl.toString(),
                width: 320,
                height: 320,
                correctLevel: QRCode.CorrectLevel.M
            });
        }

        // End session function
        function endSession() {
            if (confirm('Are you sure you want to end this session?')) {
                // Send message to parent window to end the session
                if (window.opener && !window.opener.closed) {
                    try {
                        window.opener.postMessage({ 
                            action: 'endSessionFromProjector'
                        }, '*');
                    } catch (e) {
                        console.log('Error communicating with main window:', e);
                    }
                }
                
                // Close the window
                window.close();
            }
        }

        // Listen for messages from main window
        window.addEventListener('message', function(event) {
            if (event.data && event.data.action === 'closeProjectorWindow') {
                window.close();
            }
        });

        // Handle window beforeunload
        window.addEventListener('beforeunload', function() {
            if (window.opener && !window.opener.closed) {
                window.opener.postMessage({ 
                    action: 'projectorWindowClosed'
                }, '*');
            }
        });

        // Prevent scrolling
        document.addEventListener('wheel', function(e) {
            e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Check-In</title>
    <meta name="description" content="Attendance Tracker student check-in">
    <style>
        :root {
            --bg: #f4f6fb;
            --card: #ffffff;
            --ink: #1f2937;
            --muted: #6b7280;
            --accent: #0f766e;
            --accent-2: #0ea5a4;
            --danger: #b91c1c;
            --ok: #166534;
            --border: #dbe2ea;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 20% 15%, rgba(14, 165, 164, 0.14), transparent 45%),
                radial-gradient(circle at 80% 0%, rgba(15, 118, 110, 0.10), transparent 35%),
                var(--bg);
            display: grid;
            place-items: center;
            padding: 18px;
        }

        .card {
            width: 100%;
            max-width: 460px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
            overflow: hidden;
        }

        .hero {
            padding: 20px 22px 12px;
            background: linear-gradient(160deg, rgba(14,165,164,0.10), rgba(255,255,255,0));
        }

        .hero h1 {
            margin: 0 0 8px;
            font-size: 1.35rem;
        }

        .hero p {
            margin: 0;
            color: var(--muted);
            line-height: 1.4;
        }

        form {
            padding: 18px 22px 22px;
            display: grid;
            gap: 14px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.92rem;
            font-weight: 600;
        }

        input {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 13px;
            font: inherit;
            color: inherit;
            background: #fff;
        }

        input:focus {
            outline: 2px solid rgba(14, 165, 164, 0.25);
            border-color: var(--accent-2);
        }

        .hint {
            color: var(--muted);
            font-size: 0.8rem;
            margin-top: 4px;
        }

        .actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 12px 14px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: white;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        button[disabled] {
            opacity: 0.7;
            cursor: wait;
        }

        .status {
            margin: 0;
            padding: 0 22px 18px;
            font-size: 0.92rem;
            line-height: 1.4;
            min-height: 1.4em;
        }

        .status.error { color: var(--danger); }
        .status.success { color: var(--ok); }

        .session-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            padding: 8px 10px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: #fff;
            font-size: 0.85rem;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <main class="card">
        <section class="hero">
            <h1>Class Check-In</h1>
            <p>Enter your name and student ID to record attendance for this session.</p>
            <div class="session-chip">
                <span>Code:</span>
                <strong id="session_code_chip">----</strong>
            </div>
        </section>

        <form id="checkin_form" novalidate>
            <div>
                <label for="checkin_code">Session Code</label>
                <input id="checkin_code" name="checkin_code" maxlength="12" autocomplete="off" required>
            </div>

            <div>
                <label for="student_id">Student ID</label>
                <input id="student_id" name="student_id" placeholder="e.g., S12345678" maxlength="32" autocomplete="off" required>
                <div class="hint">Use your school-issued student ID.</div>
            </div>

            <div>
                <label for="first_name">First Name</label>
                <input id="first_name" name="first_name" autocomplete="given-name" required>
            </div>

            <div>
                <label for="last_name">Last Name</label>
                <input id="last_name" name="last_name" autocomplete="family-name" required>
            </div>

            <div class="actions">
                <button type="submit" id="submit_btn">Check In</button>
            </div>
        </form>

        <p id="status_message" class="status" aria-live="polite"></p>
    </main>

    <script src="js/config.js"></script>
    <script src="js/checkin.js"></script>
</body>
</html>
